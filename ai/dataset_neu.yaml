# NEU-DET dataset configuration for Ultralytics YOLO
# Dataset: NEU Surface Defect Database (NEU-DET)
# Source:  https://faculty.neu.edu.cn/songkc/en/zdylm/263270/list/index.htm
# Paper:   Song & Yan, "A noise robust method based on completed local binary
#          patterns for hot-rolled steel strip surface defects", Applied Surface
#          Science, 2013.
# License: Not stated by the official source; obtain permission before
#          production or commercial use. The referenced Kaggle mirror also
#          reports its license as Unknown.
#
# Images:  1800 source images, 200x200 px, grayscale steel surface crops.
#          Preparation excludes one exact duplicate, leaving 1799 images.
# Format:  Original annotations in Pascal VOC XML; converted to YOLO txt by
#          `python -m ai.train_eval_pipeline prepare`.

# Run training and evaluation from the repository root so this relative path
# resolves consistently.
path: ./datasets/NEU-DET          # dataset root
train: images/train               # train images (relative to 'path')
val:   images/val                 # val   images (relative to 'path')
test:  images/test                # test  images (relative to 'path')

# ── Classes ──────────────────────────────────────────────────────────────────
names:
  0: crazing
  1: inclusion
  2: patches
  3: pitted_surface
  4: rolled-in_scale
  5: scratches

nc: 6
