services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      STEELGUARD_MAX_UPLOAD_BYTES: "${STEELGUARD_MAX_UPLOAD_BYTES:-}"
      STEELGUARD_AI_MODE: "${STEELGUARD_AI_MODE:-dummy}"
      STEELGUARD_MODEL_PATH: "${STEELGUARD_MODEL_PATH:-}"
      STEELGUARD_CONFIDENCE_THRESHOLD: "${STEELGUARD_CONFIDENCE_THRESHOLD:-0.25}"
      STEELGUARD_RECOMMENDATION_MAP_JSON: "${STEELGUARD_RECOMMENDATION_MAP_JSON:-}"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STEELGUARD_USE_MOCK_API: "${STEELGUARD_USE_MOCK_API:-true}"
      STEELGUARD_API_BASE_URL: "${STEELGUARD_API_BASE_URL:-http://backend:8000}"
      STEELGUARD_API_CONNECT_TIMEOUT_SECONDS: "${STEELGUARD_API_CONNECT_TIMEOUT_SECONDS:-}"
      STEELGUARD_API_READ_TIMEOUT_SECONDS: "${STEELGUARD_API_READ_TIMEOUT_SECONDS:-}"
      STEELGUARD_MAX_UPLOAD_BYTES: "${STEELGUARD_MAX_UPLOAD_BYTES:-}"
      STEELGUARD_MOCK_DELAY_SECONDS: "${STEELGUARD_MOCK_DELAY_SECONDS:-0.6}"
    restart: unless-stopped
